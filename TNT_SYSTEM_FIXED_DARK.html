<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f1f2f4; --border:#e1e4e8;
  --text:#151515; --muted:#73777f; --amber:#c49a45; --amber-deep:#9b752c;
  --green:#26734d; --green-bg:#e8f4ed; --red:#b53a32; --red-bg:#fbeceb;
  --blue:#355f82; --blue-bg:#eaf1f7; --radius:16px;
  --shadow:0 8px 28px rgba(18,18,18,.055); --black:#111214;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,#111 0 70%,var(--amber) 70% 100%);z-index:2000}
.app{display:flex;min-height:100vh}
.sidebar{
  width:270px;flex-shrink:0;background:var(--black);color:#fff;padding:26px 18px 20px;
  display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;
  box-shadow:-8px 0 30px rgba(0,0,0,.08)
}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand-mark{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:13px;padding:5px}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand-logo-lg{width:132px;margin:0 auto 18px;display:block;filter:drop-shadow(0 5px 12px rgba(0,0,0,.08))}
.brand-name{font-weight:800;font-size:17px;line-height:1.15;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:#a9adb4;margin-top:3px}
.me-box{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1b1c1f;border:1px solid #292b30;border-radius:14px;padding:11px 12px}
.me-name{font-size:12.5px;font-weight:700;color:#fff;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.me-role{font-size:10.5px;color:#9fa3aa}
.logout{font-size:11px;color:#e5c67e;cursor:pointer;background:none;border:none;font-family:inherit}
.nav{display:flex;flex-direction:column;gap:5px;flex:1}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-radius:11px;cursor:pointer;font-size:13.5px;color:#d7d9dd;border:1px solid transparent;transition:.18s}
.nav-item .nav-left{display:flex;align-items:center;gap:9px}
.nav-item .dot{width:9px;height:9px;border-radius:50%;background:var(--accent,var(--amber));box-shadow:0 0 0 3px color-mix(in srgb, var(--accent,var(--amber)) 25%, transparent);flex-shrink:0}
.nav-item:hover{background:#1c1d20;color:#fff}
.nav-item.active{background:linear-gradient(90deg,color-mix(in srgb, var(--accent,var(--amber)) 22%, #1c1d20),#1c1d20);color:#fff;border-color:#35373d;font-weight:800;box-shadow:inset 3px 0 0 var(--accent,var(--amber))}
.nav-badge{background:var(--accent,var(--amber));color:#fff;font-size:10px;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
.main{flex:1;padding:34px 38px 50px;max-width:1240px;margin:0 auto;width:100%}
h1{font-size:25px;margin:0 0 5px;font-weight:800;letter-spacing:-.3px}
.page-sub{color:var(--muted);font-size:12.5px;margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 6px;font-weight:800}
.card2{background:#fff!important;border:1px solid var(--border)!important;border-radius:14px!important;padding:16px!important;margin-bottom:12px!important;box-shadow:0 3px 14px rgba(0,0,0,.035)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.step{border:1px solid var(--border);background:#fbfbfc;border-radius:14px;padding:16px;margin-top:14px}
.step:first-child{margin-top:0}
.step-title{font-size:12px;font-weight:800;color:var(--amber-deep);margin-bottom:12px;display:flex;align-items:center;gap:7px}

// Secure file uploads: handled by a Netlify Function.

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const ROLES = [
  {id:'manager', label:'المدير'},
  {id:'reception', label:'الرسبشن (حركة زبائن)'},
  {id:'external', label:'مدير المشاريع الخارجية'},

];
const PAGES = {

  reception: [{id:'projects', label:'قائمة المشاريع'}, {id:'clients', label:'قائمة العملاء'}, {id:'reception', label:'حركة زبائن'}, {id:'chat', label:'الشات الداخلي'}],
  external:  [{id:'projects', label:'قائمة المشاريع'}, {id:'clients', label:'قائمة العملاء'}, {id:'external', label:'مدير المشاريع الخارجية'}, {id:'chat', label:'الشات الداخلي'}],
  design2d:  [{id:'projects', label:'قائمة المشاريع'}, {id:'clients', label:'قائمة العملاء'}, {id:'design2d', label:'التصاميم'}, {id:'chat', label:'الشات الداخلي'}],
  design3d:  [{id:'projects', label:'قائمة المشاريع'}, {id:'clients', label:'قائمة العملاء'}, {id:'design3d', label:'تصاميم 3D Max'}, {id:'chat', label:'الشات الداخلي'}],
  contracts: [{id:'projects', label:'قائمة المشاريع'}, {id:'clients', label:'قائمة العملاء'}, {id:'contracts', label:'قسم العقود'}, {id:'chat', label:'الشات الداخلي'}],
  finance:   [{id:'projects', label:'قائمة المشاريع'}, {id:'clients', label:'قائمة العملاء'}, {id:'finance', label:'الحسابات'}, {id:'chat', label:'الشات الداخلي'}],
  none:      [],
};

let role = null, page = 'overview';
let managerExists = null; // null = unknown yet, true/false once checked
let customers = [], payments = [], messages = [], teamUsers = [];
let currentUser = null;
let lastMainPage = null;
const notifiedOverdue = new Set();
let unsubs = [];

function roleLabel(id){ const r=ROLES.find(x=>x.id===id); return r?r.label:(id||'—'); }
function maskEmail(email){
  if(!email) return '';
  const [local, domain] = email.split('@');
  if(!domain) return '***';
  const localMasked = local.length<=2 ? local[0]+'*' : local.slice(0,2)+'*'.repeat(Math.max(2,local.length-2));
  const domParts = domain.split('.');
  const domMasked = (domParts[0][0]||'*')+'***'+(domParts.length>1?'.'+domParts.slice(1).join('.'):'');
  return `${localMasked}@${domMasked}`;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function baghdadDateTime(ts){ if(!ts) return '—'; const d=ts?.toDate?ts.toDate():new Date(ts); return new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(d); }
let tntAudioCtx = null;
function ensureAudio(){
  try{
    if(!tntAudioCtx) tntAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(tntAudioCtx.state==='suspended') tntAudioCtx.resume();
    return tntAudioCtx;
  }catch(e){ return null; }
}
function beep(){
  try{
    const ctx = ensureAudio(); if(!ctx) return;
    let t = 0;
    for(let i=0;i<3;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.18;
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.28); t += 0.38;
    }
  }catch(e){}
}
async function activateAlerts(){
  ensureAudio();
  try{ if('Notification' in window && Notification.permission==='default') await Notification.requestPermission(); }catch(e){}
}
document.addEventListener('pointerdown', activateAlerts, {once:true});
function notifyOverdue(customerName){
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('⏰ انتهى الوقت المحدد', { body: `الزبون "${customerName}" تجاوز الوقت المحدد وينتظرك الآن`, requireInteraction:true });
    }
  }catch(e){}
}
function showToast(text){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>⏰ ${escapeHtml(text)}</span><span class="x">✕</span>`;
  t.querySelector('.x').onclick = ()=>t.remove();
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 8000);
}
function clockSVG(pct, overdue){
  const c = overdue ? 'var(--red)' : 'var(--amber)';
  const r = 15, circ = 2*Math.PI*r, off = circ * (1-pct);
  return `<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--border)" stroke-width="3"/>
  <circle cx="18" cy="18" r="${r}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"
    stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 18 18)"/>
  <text x="18" y="22" text-anchor="middle" font-size="13" fill="${c}">⏰</text></svg>`;
}
function timerHTML(c){
  if(!c.deadlineAt) return '<span class="hint">—</span>';
  const now = Date.now();
  const total = (c.timeLimitHours||0)*3600000;
  const remain = c.deadlineAt - now;
  const overdue = remain <= 0;
  const pct = total>0 ? Math.max(0, Math.min(1, remain/total)) : 0;
  let txt;
  if(overdue){ txt = 'انتهى الوقت'; }
  else {
    const hrs = Math.floor(remain/3600000), mins = Math.floor((remain%3600000)/60000);
    txt = hrs>0 ? `${hrs} س ${mins} د متبقية` : `${mins} د متبقية`;
  }
  const dueBaghdad = new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(c.deadlineAt));
  return `<span data-timer-for="${c.id}"><div class="clock-wrap"><div class="clock ${overdue?'overdue':''}">${clockSVG(pct, overdue)}</div><span class="time-txt ${overdue?'overdue':''}">${txt}<small style="display:block;opacity:.7">الاستحقاق ${dueBaghdad} بتوقيت بغداد</small></span></div></span>`;
}
function statusBadge(status){
  const map = {
    external_pending: ['badge warn','بانتظار القياسات الخارجية'],
    design_pending: ['badge info','بانتظار قسم التصاميم'],
    contracts_pending: ['badge info','بانتظار قسم العقود'],
    reception_ready: ['badge wait','جاهز للتوجيه'],
    done: ['badge ok','مكتمل'],
  };
  const m = map[status] || ['badge wait', status];
  return `<span class="${m[0]}">${m[1]}</span>`;
}
function attachChips(list){
  if(!list || !list.length) return '';
  return `<div class="attach-row">${list.map(a=>`<a class="attach-chip" href="${a.url}" target="_blank" rel="noopener">${a.kind==='audio'?'🎙️':(a.kind==='video'?'🎬':'📎')} ${escapeHtml(a.name||'ملف')}</a>`).join('')}</div>`;
}

// ---------------- storage upload helpers ----------------
async function uploadFile(file){
  try{
    if(!file) throw new Error("لم يتم اختيار ملف");
    const maxSize = 20 * 1024 * 1024;
    if(file.size > maxSize) throw new Error("حجم الملف أكبر من 20MB");
    const content = await fileToBase64(file);
    const res = await fetch(UPLOAD_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:file.name,
        type:file.type || "application/octet-stream",
        content
      })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.url) throw new Error(data.error || "فشل رفع الملف");
    return {name:file.name, url:data.url, kind:file.type.startsWith("audio/")?"audio":file.type.startsWith("video/")?"video":"file"};
  }catch(err){
    showToast("تعذر رفع الملف: " + (err.message || "خطأ غير معروف"));
    throw err;
  }
}
async function uploadFileList(fileList){
  const out = [];
  for(const file of fileList){
    try{ out.push(await uploadFile(file)); }
    catch(err){ showToast('ما كدرنا نرفع ملف: '+file.name); console.error(err); }
  }
  return out;
}
function wireUploadRow(container, onFiles){
  const fileInput = container.querySelector('[data-file-input]');
  const recBtn = container.querySelector('[data-rec-btn]');
  if(fileInput) fileInput.onchange = async ()=>{
    if(!fileInput.files.length) return;
    const res = await uploadFileList(fileInput.files);
    fileInput.value='';
    if(res.length) onFiles(res);
  };
  if(recBtn){
    let rec=null, chunks=[];
    recBtn.onclick = async ()=>{
      if(rec && rec.state==='recording'){ rec.stop(); return; }
      try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        chunks=[]; rec = new MediaRecorder(stream);
        rec.ondataavailable = e=>chunks.push(e.data);
        rec.onstop = async ()=>{
          recBtn.classList.remove('recording');
          const blob = new Blob(chunks, {type:'audio/webm'});
          stream.getTracks().forEach(t=>t.stop());
          try{
            const file = new File([blob], 'voice_'+Date.now()+'.webm', {type:'audio/webm'});
            const res = await uploadFile(file);
            onFiles([res]);
          }catch(err){ showToast('ما كدرنا نحفظ التسجيل الصوتي'); }
        };
        rec.start(); recBtn.classList.add('recording');
      }catch(err){ showToast('ما كدرنا نوصل للمايك'); }
    };
  }
}
function uploadRowHTML(){
  return `<div class="upload-row">
    <label class="btn small secondary" style="cursor:pointer;">📎 رفع صور / فيديو / ملف<input type="file" data-file-input multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx" style="display:none;"></label>
    <button type="button" class="btn small secondary" data-rec-btn>🎙️ تسجيل صوتي</button>
  </div>`;
}

// ---------------- form value preservation ----------------
function captureFormValues(main){
  const vals = {};
  main.querySelectorAll('input[name], textarea[name], select[name]').forEach(el=>{
    if(el.type==='radio'){ if(el.checked) vals[el.name]=el.value; }
    else if(el.type!=='file'){ vals[el.name]=el.value; }
  });
  return vals;
}
function restoreFormValues(main, vals){
  Object.keys(vals).forEach(name=>{
    const radios = main.querySelectorAll(`input[name="${name}"][type=radio]`);
    if(radios.length){ radios.forEach(r=>{ r.checked = (r.value===vals[name]); }); return; }
    const el = main.querySelector(`[name="${name}"]`);
    if(el && el.type!=='file') el.value = vals[name];
  });
}

      <h1>TNT Group</h1>
      <div class="login-sub">نظام سير العمل الداخلي</div>

      <div class="login-err" id="loginErr"></div>
      <form id="authForm">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" name="email" required></div>
        <div class="field"><label>كلمة المرور</label><input type="password" name="password" required minlength="6"></div>
        <button class="btn" type="submit" style="width:100%;">${mode==='login'?'دخول':'إنشاء الحساب'}</button>
      </form>
    </div></div>`;
  root.querySelectorAll('.login-tab').forEach(t=>t.onclick=()=>renderLogin(t.dataset.tab));
  root.querySelector('#authForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const email = f.get('email'), password = f.get('password');
    activateAlerts();
    const errBox = root.querySelector('#loginErr');
    errBox.textContent = '';
    try{
      if(mode==='signup'){
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const managerSnap = await dbf.collection('users').where('role','==','manager').limit(1).get();
        const isFirst = managerSnap.empty;
        await dbf.collection('users').doc(cred.user.uid).set({
          email, role: isFirst ? 'manager' : null, createdAt: Date.now(),
        });
      } else {
        const btn = e.target.querySelector('button[type=\"submit\"]');
        const oldText = btn ? btn.textContent : '';
        if(btn){ btn.disabled = true; btn.textContent = 'جاري الدخول...'; }
        try {
          const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
          currentUser = cred.user;
          const userDoc = await dbf.collection('users').doc(cred.user.uid).get();
          const data = userDoc.exists ? userDoc.data() : null;
          role = data && data.role ? data.role : null;
          page = role && PAGES[role] && PAGES[role][0] ? PAGES[role][0].id : 'overview';
          renderApp();
          render();
        } finally {
          if(btn){ btn.disabled = false; btn.textContent = oldText || 'دخول'; }
        }
      }
    }catch(err){
      console.error('Login error:', err);
      errBox.textContent = arErr(err.code) + (err.code ? ' ('+err.code+')' : '');
      errBox.style.display = 'block';
    }
  };
}
function arErr(code){
  const map = {
    'auth/invalid-email':'إيميل غير صحيح',
    'auth/user-not-found':'ماكو حساب بهذا الإيميل',
    'auth/wrong-password':'كلمة المرور غلط',
    'auth/invalid-credential':'الإيميل أو كلمة المرور غلط',
    'auth/email-already-in-use':'هذا الإيميل مستخدم من قبل — جرب تسجيل الدخول',
    'auth/weak-password':'كلمة المرور لازم تكون 6 أحرف على الأقل',
  };
  return map[code] || 'صار خطأ، جرب مرة ثانية';
}

function render(){ renderIdentity(); renderNav(); renderMain(); if(role && 'Notification' in window && Notification.permission==='default'){ Notification.requestPermission(); } }
function renderIdentity(){
  const box = document.getElementById('identityBox');
  const myRow = teamUsers.find(u=>u.id===currentUser.uid);
  const label = role ? roleLabel(role) : 'بانتظار المدير';
  box.innerHTML = `<div class="me-box"><div><div class="me-name">${escapeHtml(maskEmail((myRow&&myRow.email)||currentUser.email))}</div><div class="me-role">${label}</div></div><button class="logout" id="logoutBtn">خروج</button></div>`;
  box.querySelector('#logoutBtn').onclick = ()=>auth.signOut();
}

const NAV_COLORS = {
  overview:'#c49a45', projects:'#4f7cff', clients:'#16a085', reception:'#2f6fed', external:'#e07b39',
  design2d:'#8b5cf6', design3d:'#e0507a', contracts:'#5b6fd8', finance:'#2fa66a',
  chat:'#22b8c8', team:'#d64550'
};
function renderNav(){
  const nav = document.getElementById('navList');
  const pages = PAGES[role] || PAGES.none;
  nav.innerHTML = pages.map(p=>{
    let badge = '';
    if(p.id==='clients') badge = new Set(customers.map(c=>normalizeCustomerPhone(c.phone)).filter(Boolean)).size;
    if(p.id==='external') badge = customers.filter(c=>c.status==='external_pending').length;
    if(p.id==='design2d') badge = customers.filter(c=>c.status==='design_pending' && c.wantedDept==='2d').length;
    if(p.id==='design3d') badge = customers.filter(c=>c.status==='design_pending' && c.wantedDept==='3d').length;
    if(p.id==='contracts') badge = customers.filter(c=>c.status==='contracts_pending').length;
    if(p.id==='finance') badge = payments.filter(pm=>pm.status==='pending').length;
    if(p.id==='overview') badge = customers.filter(c=>c.managerAlert).length;
    if(p.id==='team') badge = teamUsers.filter(u=>!u.role).length;
    const accent = NAV_COLORS[p.id] || '#c49a45';
    const initial = (p.label||'?').trim().charAt(0);
    const iconHtml = (p.id==='reception')
      ? `<img src="${NAV_ICON_RECEPTION}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.08);">`
      : `<span class="nav-avatar">${escapeHtml(initial)}</span>`;
    return `<div class="nav-item ${p.id===page?'active':''}" data-p="${p.id}" style="--accent:${accent}"><span class="nav-left">${iconHtml}<span>${p.label}</span></span>${badge? `<span class="nav-badge">${badge}</span>`:''}</div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{page=el.dataset.p; renderNav(); renderMain();});
}
function renderMain(){
  const main = document.getElementById('mainView');
  const preserved = (lastMainPage===page) ? captureFormValues(main) : {};
  main.innerHTML = '';
  if(!role){ main.innerHTML = `<div class="waiting"><h1>بانتظار المدير</h1><p>لسه ما تحدد لك دور بالنظام. خبر المدير يفتح "إدارة الموظفين" ويحدد صلاحيتك.</p><p class="hint" style="margin-top:20px;">معرّف حسابك (UID) — للمساعدة الفنية: <br><b style="user-select:all;">${currentUser.uid}</b></p></div>`; lastMainPage=null; return; }
  if(page==='overview') renderOverview(main);
  else if(page==='projects') renderProjects(main);
  else if(page==='clients') renderClients(main);
  else if(page==='reception') renderReception(main);
  else if(page==='external') renderExternal(main);
  else if(page==='design2d') renderDesign(main,'2d');
  else if(page==='design3d') renderDesign(main,'3d');
  else if(page==='contracts') renderContracts(main);
  else if(page==='finance') renderFinance(main);
  else if(page==='chat') renderChat(main);
  else if(page==='team') renderTeam(main);
  else if(page==='customerDetail') renderCustomerDetail(main);
  else if(page==='projectDetail') renderProjectDetail(main);
  restoreFormValues(main, preserved);
  lastMainPage = page;
}
function updateTimers(){
  document.querySelectorAll('[data-timer-for]').forEach(el=>{
    const c = customers.find(x=>x.id===el.dataset.timerFor);
    if(c) el.outerHTML = timerHTML(c);
  });
}

// ---------- overview ----------
function renderOverview(main){
  const alerts = customers.filter(c=>c.managerAlert);
  main.innerHTML = `<h1>لوحة المدير</h1><div class="page-sub">نظرة عامة على كل الزبائن والمهام الحالية</div>
    ${alerts.length? `<div class="card" style="border-color:var(--red)"><h2 style="color:var(--red)">⏰ تنبيهات تجاوز الوقت (${alerts.length})</h2>
      ${alerts.map(c=>`<div class="detail-row"><b>${escapeHtml(c.name)}</b> تجاوز الموظف المسؤول (${roleLabel(c.assignedRole)}) الوقت المحدد لهذا الزبون</div>`).join('')}
    </div>`:''}
    <div class="card"><h2>كل الزبائن (${customers.length})</h2>${customerTable(customers, true)}</div>`;
  wireCustomerTableLinks(main);
}
function customerTable(list, full){
  if(!list.length) return '<div class="empty">لا يوجد عملاء حالياً</div>';
  return `<table><thead><tr><th>العميل</th><th>المشروع / الفرع</th><th>الحالة</th>${full?'<th>المسؤول</th>':''}<th>الوقت</th><th>مرفقات</th></tr></thead><tbody>
  ${list.map(c=>`<tr>
    <td><span class="dup-branch" style="padding:0;background:none;" data-open-customer="${escapeHtml(c.phone)}"><b style="color:var(--blue);cursor:pointer;">${escapeHtml(c.name)}</b></span><br><span class="hint">${escapeHtml(c.phone)}</span></td>
    <td><span class="project-link" data-open-project="${c.id}">${escapeHtml(c.projectName||'—')}</span><br><span class="hint">${escapeHtml(c.branch||'—')}</span></td>
    <td>${statusBadge(c.status)}</td>
    ${full?`<td>${roleLabel(c.assignedRole)}</td>`:''}
    <td>${timerHTML(c)}</td>
    <td>${(c.attachments||[]).length || '—'}</td>
  </tr>`).join('')}
  </tbody></table>`;
}
function wireCustomerTableLinks(container){
  container.querySelectorAll('[data-open-customer]').forEach(el=>{ el.onclick=()=>openCustomerDetail(el.dataset.openCustomer); });
  container.querySelectorAll('[data-open-project]').forEach(el=>{ el.onclick=()=>openProjectDetail(el.dataset.openProject); });
}
let selectedProjectId=null;
function openProjectDetail(id){ selectedProjectId=id; page='projectDetail'; render(); }
function renderProjectDetail(main){
  const c=customers.find(x=>x.id===selectedProjectId);
  if(!c){ main.innerHTML='<div class="empty">المشروع غير موجود</div>'; return; }
  const sourceMap={direct:'مباشر للشركة',manager:'عن طريق المدير',referral:'زبون جاب زبون',previous_customer:'زبون سابق',social_media:'سوشيال ميديا',partner_company:'شركة متعاونة',engineer:'مهندس',promoter:'مروج',engineer_promoter:'مهندس أو مروج'};
  main.innerHTML=`<h1>${escapeHtml(c.projectName||'المشروع')}</h1><div class="page-sub">ملف المشروع الكامل</div><div class="card">
    <div class="detail-row"><b>اسم العميل</b>${escapeHtml(c.name||'—')}</div><div class="detail-row"><b>رقم العميل</b>${escapeHtml(c.phone||'—')}</div>
    <div class="detail-row"><b>الفرع أو المنطقة</b>${escapeHtml(c.branch||'—')}</div><div class="detail-row"><b>اسم المشروع</b>${escapeHtml(c.projectName||'—')}</div>
    <div class="detail-row"><b>طريقة الوصول</b>${escapeHtml(sourceMap[c.source]||c.source||'—')}</div>
    ${c.socialPlatform?`<div class="detail-row"><b>السوشيال</b>${escapeHtml(c.socialPlatform)}</div>`:''}${c.partnerCompany?`<div class="detail-row"><b>الشركة المتعاونة</b>${escapeHtml(c.partnerCompany)} ${c.partnerPercent!=null?'— '+c.partnerPercent+'%':''}</div>`:''}
    ${c.referrerName?`<div class="detail-row"><b>${c.source==='promoter'?'المروج':'المهندس'}</b>${escapeHtml(c.referrerName)} ${c.referrerPercent!=null?'— '+c.referrerPercent+'%':''}</div>`:''}
    <div class="detail-row"><b>القسم المسؤول</b>${roleLabel(c.assignedRole)}</div><div class="detail-row"><b>الحالة</b>${statusBadge(c.status)}</div>
    <div class="detail-row"><b>تسجيل المشروع</b>${baghdadDateTime(c.createdAt)} — بتوقيت بغداد</div>
    <div class="detail-row"><b>آخر توجيه</b>${baghdadDateTime(c.assignedAt)} — بتوقيت بغداد</div>
    <div class="detail-row"><b>الوقت</b>${timerHTML(c)}</div><div class="detail-row"><b>الملاحظات/القياسات</b>${escapeHtml(c.measurements||'—')}</div>
    <div class="detail-row"><b>المرفقات</b><div>${attachChips(c.attachments||[])||'—'}</div></div>
    <button class="btn secondary" id="backProjects">رجوع لقائمة المشاريع</button></div>`;
  main.querySelector('#backProjects').onclick=()=>{page='projects';render();};
}

// ---------- projects ----------
function renderProjects(main){
  main.innerHTML = `<h1>قائمة المشاريع</h1><div class="page-sub">القائمة الرئيسية المشتركة — كل عميل مسجل يظهر هنا ويتحدث مساره تلقائياً. البحث بالاسم أو الرقم يعرض كل فروع العميل، والبحث باسم المشروع أو الفرع يعرض ذلك الفرع فقط</div>
    <div class="card"><div class="grid2">
      <div class="field"><label>بحث بالاسم، الرقم، اسم المشروع، أو الفرع</label><input id="projectSearch" placeholder="اكتب اسم العميل، رقمه، اسم المشروع، أو الفرع..."></div>
      <div class="field"><label>فلترة حسب القسم الحالي</label><select id="projectRoleFilter"><option value="">كل الأقسام</option><option value="reception">الرسبشن</option><option value="external">المشاريع الخارجية</option><option value="design2d">تصاميم 2D</option><option value="design3d">تصاميم 3D Max</option><option value="contracts">العقود</option><option value="finance">الحسابات</option></select></div>
    </div><div id="projectsTable"></div></div>`;
  const draw=()=>{
    const q=(main.querySelector('#projectSearch').value||'').trim().toLowerCase();
    const rf=main.querySelector('#projectRoleFilter').value;
    const list=customers.filter(c=>(!q ||
      (c.name||'').toLowerCase().includes(q) ||
      (c.phone||'').toLowerCase().includes(q) ||
      (c.projectName||'').toLowerCase().includes(q) ||
      (c.branch||'').toLowerCase().includes(q)
    ) && (!rf || c.assignedRole===rf));
    main.querySelector('#projectsTable').innerHTML=customerTable(list,true);
    wireCustomerTableLinks(main.querySelector('#projectsTable'));
  };
  main.querySelector('#projectSearch').oninput=draw;
  main.querySelector('#projectRoleFilter').onchange=draw;
  draw();
}

// ---------- clients: one customer profile per unique phone ----------
function normalizeCustomerPhone(v){
  // يدعم الأرقام العربية/الفارسية وصيغ العراق القديمة حتى تبقى الداتا القديمة ظاهرة
  const ar='٠١٢٣٤٥٦٧٨٩', fa='۰۱۲۳۴۵۶۷۸۹';
  let x=String(v??'').trim().replace(/[٠-٩]/g,d=>ar.indexOf(d)).replace(/[۰-۹]/g,d=>fa.indexOf(d)).replace(/[^0-9]/g,'');
  if(x.startsWith('00964')) x='0'+x.slice(5); else if(x.startsWith('964')) x='0'+x.slice(3);
  return x;
}
function legacyPhone(c){ return c.phone || c.customerPhone || c.clientPhone || c.phoneNumber || c.mobile || c.number || ''; }
function legacyName(c){ return c.name || c.customerName || c.clientName || c.fullName || 'عميل قديم'; }
function hydrateLegacyCustomer(c){ return {...c, phone:legacyPhone(c), name:legacyName(c), projectName:c.projectName||c.project||c.service||'', branch:c.branch||c.area||c.location||''}; }
function renderClients(main){
  const groups=new Map();
  customers.map(hydrateLegacyCustomer).forEach(c=>{
    const phoneKey=normalizeCustomerPhone(c.phone);
    // لا نخفي السجل القديم حتى لو كان رقمه ناقصاً؛ نعرضه بمعرّف مستقل
    const key=phoneKey || ('legacy:'+c.id);
    if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(c);
  });
  main.innerHTML=`<h1>قائمة العملاء</h1><div class="page-sub">بيانات العميل مرة واحدة فقط — ومن ملف العميل تضيف أي مشروع أو فرع جديد على نفس الرقم. السجلات القديمة تظهر تلقائياً بدون إعادة إدخال.</div>
  <div class="card"><div class="field"><label>بحث باسم العميل أو الرقم أو اسم المشروع أو الفرع/المنطقة</label><input id="clientSearch" placeholder="ابحث هنا..."></div><div id="clientsTable"></div></div>`;
  const draw=()=>{
    const q=(main.querySelector('#clientSearch').value||'').trim().toLowerCase();
    const rows=[...groups.values()].filter(ps=>!q || ps.some(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').toLowerCase().includes(q)||(c.projectName||'').toLowerCase().includes(q)||(c.branch||'').toLowerCase().includes(q)));
    main.querySelector('#clientsTable').innerHTML=rows.length?`<table><thead><tr><th>العميل</th><th>رقم العميل</th><th>عدد المشاريع/الفروع</th><th>المشاريع والفروع</th><th></th></tr></thead><tbody>${rows.map(ps=>{const c=ps[0];return `<tr><td><b>${escapeHtml(c.name||'—')}</b></td><td>${escapeHtml(c.phone||'—')}</td><td>${ps.length}</td><td>${ps.map(x=>`<span class="dup-branch">${escapeHtml(x.projectName||'—')} — ${escapeHtml(x.branch||'—')}</span>`).join(' ')}</td><td><button class="btn small" data-client-phone="${escapeHtml(c.phone)}">فتح ملف العميل</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">لا يوجد عملاء مطابقين</div>';
    main.querySelectorAll('[data-client-phone]').forEach(b=>b.onclick=()=>openCustomerDetail(b.dataset.clientPhone));
  };
  main.querySelector('#clientSearch').oninput=draw; draw();
}

        <div class="step"><div class="step-title">مرفقات (صور، فيديو، تسجيل صوتي)</div>
          <div id="attachZone"></div>
          <div id="attachList" class="attach-row"></div>
        </div>
        <div class="step"><div class="step-title">الوقت المسموح والمسؤول</div>
          <div class="grid2">
            <div class="field"><label>الوقت المحدد لإنجاز الخطوة (بالساعات)</label><input type="number" name="timeLimit" value="1" min="0.25" step="0.25"></div>
            <div class="field"><label>الموظف/القسم المستلم تلقائياً</label>
              <div id="autoAssigneeDisplay" class="auto-assignee">اختاري حالة العميل من الأعلى</div>
            </div>
          </div>
        </div>
        <button class="btn" type="submit">حفظ وتوجيه للقسم</button>
      </form>`;
  const formPendingAttachments = [];
  host.querySelector('#attachZone').innerHTML = uploadRowHTML();
  wireUploadRow(host.querySelector('#attachZone'), (files)=>{ formPendingAttachments.push(...files); renderPendingChips(); });
  function renderPendingChips(){
    host.querySelector('#attachList').innerHTML = formPendingAttachments.map((a,i)=>
      `<span class="attach-chip">${a.kind==='audio'?'🎙️':(a.kind==='video'?'🎬':'📎')} ${escapeHtml(a.name)} <span data-remove="${i}" style="cursor:pointer;">✕</span></span>`).join('');
    host.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{ formPendingAttachments.splice(parseInt(x.dataset.remove),1); renderPendingChips(); });
  }
  renderPendingChips();

  function updateSourceExtrasVisibility(){
    const source = host.querySelector('[name=source]:checked')?.value;
    const socialField = host.querySelector('#socialPlatformField');
    const partnerField = host.querySelector('#partnerCompanyField');
    const engineerField = host.querySelector('#engineerField');
    socialField.style.display = source==='social_media' ? '' : 'none';
    partnerField.style.display = source==='partner_company' ? '' : 'none';
    engineerField.style.display = (source==='engineer'||source==='promoter') ? '' : 'none';
    const nlab=host.querySelector('#referrerNameLabel'), plab=host.querySelector('#referrerPercentLabel');
    if(nlab) nlab.textContent=source==='promoter'?'اسم المروج':'اسم المهندس';
    if(plab) plab.textContent=source==='promoter'?'نسبة المروج من قيمة العقد (%)':'نسبة المهندس من قيمة العقد (%)';
    if(source!=='social_media'){ const a=host.querySelector('[name=socialPlatform]'); if(a) a.value=''; }
    if(source!=='partner_company'){ host.querySelectorAll('[name=partnerCompany],[name=partnerPercent]').forEach(a=>a.value=''); }
    if(source!=='engineer' && source!=='promoter'){ host.querySelectorAll('[name=referrerName],[name=referrerPercent]').forEach(a=>a.value=''); }
  }
  host.querySelectorAll('[name=source]').forEach(r=>r.onchange=updateSourceExtrasVisibility);
  updateSourceExtrasVisibility();

  // ---- duplicate phone detection (only relevant when phone is editable) ----
  const phoneInput = host.querySelector('#phoneInput');
  const dupBox = host.querySelector('#dupWarnBox');
  const normalizePhone = v => String(v||'').replace(/[^0-9]/g,'').replace(/^00964/,'0').replace(/^964/,'0');
  function existingByPhone(v){ const n=normalizePhone(v); return customers.map(hydrateLegacyCustomer).filter(c=>normalizePhone(c.phone)===n); }
  function showDuplicate(){
    if(locked) return false;
    const phone=phoneInput.value.trim(), existing=existingByPhone(phone);
    if(!phone || !existing.length){ dupBox.innerHTML=''; return false; }
    dupBox.innerHTML = `<div class="dup-warn"><b>⚠ هذا العميل موجود مسبقاً: ${escapeHtml(existing[0].name)} — الرقم لا يمكن تسجيله كعميل جديد.</b>
      <div style="margin-top:6px;">كل مشاريعه وفروعه الحالية:</div>

    dupBox.querySelector('#gotoCustomerBtn').onclick=()=>openCustomerDetail(existing[0].phone);
    return true;
  }
  if(!locked){
    let duplicateTimer=null;
    const checkPhoneNow=()=>{
      clearTimeout(duplicateTimer);
      const digits=normalizePhone(phoneInput.value);
      if(digits.length < 10){ dupBox.innerHTML=''; return; }
      const existing=existingByPhone(phoneInput.value);
      if(existing.length){
        showDuplicate();
        // منع الاستمرار بإنشاء عميل مكرر وفتح ملف العميل مباشرة
        phoneInput.setCustomValidity('هذا الرقم مسجل مسبقاً');
        setTimeout(()=>openCustomerDetail(existing[0].phone), 350);
      } else {
        phoneInput.setCustomValidity('');
        dupBox.innerHTML='';
      }
    };
    phoneInput.addEventListener('input',()=>{
      phoneInput.setCustomValidity('');
      clearTimeout(duplicateTimer);
      duplicateTimer=setTimeout(checkPhoneNow,250);
    });
    phoneInput.addEventListener('change',checkPhoneNow);
    phoneInput.addEventListener('blur',checkPhoneNow);
  }

  // ---- حالة العميل: كل اختيار يحدد القسم تلقائياً بدون حقل نوع الشغل ----
  const STATUS_ROUTES = {measure_only:{assignedRole:'design2d',status:'design_pending',label:'قسم تصاميم 2D'},measure_design:{assignedRole:'contracts',status:'contracts_pending',label:'قسم العقود'},design_inaccurate:{assignedRole:'external',status:'external_pending',label:'مدير المشاريع الخارجية'},no_info:{assignedRole:'external',status:'external_pending',label:'مدير المشاريع الخارجية'},measure_no_design:{assignedRole:'contracts',status:'contracts_pending',label:'قسم العقود'}};
  let selectedStage=''; const stageColors={measure_only:'#1468d8',measure_design:'#18a963',design_inaccurate:'#d68b08',no_info:'#dc2d3b',measure_no_design:'#962be2'};

  host.querySelectorAll('.status-stage-btn').forEach(btn=>btn.onclick=()=>{selectedStage=btn.dataset.stage;paintStage();}); paintStage();

  host.querySelector('#custForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const phone = (f.get('phone')||'').trim();
    if(!locked){
      const existing=existingByPhone(phone);
      if(existing.length){ showDuplicate(); showToast('هذا الرقم مسجل مسبقاً — افتح ملف العميل وأضف المشروع الجديد من هناك'); return; }
    }
    const projectName = (f.get('projectName')||'').trim();
    const branch = (f.get('branch')||'').trim();
    const isDuplicate = customers.some(c=>normalizePhone(c.phone)===normalizePhone(phone) && (c.projectName||'')===projectName && (c.branch||'')===branch);
    if(isDuplicate){ showToast('هذا المشروع/الفرع مسجل من قبل لنفس العميل — غيّر اسم المشروع أو الفرع'); return; }

    if(!selectedStage || !STATUS_ROUTES[selectedStage]){ showToast('اختاري حالة العميل أولاً'); return; }
    const route=STATUS_ROUTES[selectedStage];
    const hasMeasure=route.hasMeasure;
    const assignedRole=route.assignedRole;
    const status=route.status;
    const dept = assignedRole==='design3d'?'3d':(assignedRole==='design2d'?'2d':'');
    const timeLimit = parseFloat(f.get('timeLimit'))||1;
    await dbf.collection('customers').add({
      name: f.get('name'), phone, projectName, branch,
      source: f.get('source'), socialPlatform: f.get('socialPlatform')||'',
      partnerCompany: f.get('partnerCompany')||'', partnerPercent: f.get('partnerPercent')?parseFloat(f.get('partnerPercent')):null, referrerName: f.get('referrerName')||'', referrerPercent: f.get('referrerPercent')?parseFloat(f.get('referrerPercent')):null,
      clientStage: selectedStage,
      wantedDept: dept, measurements: f.get('measurements')||'', hasMeasureFromStart: hasMeasure,
      status, assignedRole, timeLimitHours: timeLimit,
      assignedAt: Date.now(), deadlineAt: Date.now() + timeLimit*3600000,
      managerAlert:false, quote:null, attachments: formPendingAttachments, createdAt: Date.now(), workflowHistory:[{at:Date.now(),from:'reception',to:assignedRole,action:'تسجيل العميل وتوجيه المشروع'}],
    });
    beep();
    showToast(`تم الحفظ والتحويل مباشرة إلى ${roleLabel(assignedRole)}`);
    page = assignedRole; render();
  };
}

function renderContracts(main){
  const list = customers.filter(c=>c.status==='contracts_pending');
  main.innerHTML = `<h1>قسم العقود</h1><div class="page-sub">كل مشروع واصل للعقود يحمل سجل الرسبشن كاملاً. اضغط اسم المشروع لفتح الملف الكامل.</div>
    <div class="card"><h2>المعاملات الواصلة (${list.length})</h2>${list.length?list.map(c=>contractsCard(c)).join(''):'<div class="empty">ماكو معاملات عقود حالياً</div>'}</div>`;
  wireCustomerTableLinks(main);
  main.querySelectorAll('[data-save-contract]').forEach(btn=>btn.onclick=async()=>{
    const c=customers.find(x=>x.id===btn.dataset.saveContract); if(!c) return;
    const card=btn.closest('[data-contract-card]');
    const contractStatus=card.querySelector('[name=contractStatus]').value;
    const contractValue=card.querySelector('[name=contractValue]').value;
    const contractNotes=card.querySelector('[name=contractNotes]').value;
    await dbf.collection('customers').doc(c.id).update({contractStatus,contractValue,contractNotes,lastUpdatedAt:Date.now(),workflowHistory:(c.workflowHistory||[]).concat([{at:Date.now(),from:'contracts',to:'contracts',action:'تحديث بيانات العقد'}])});
    beep(); showToast('تم حفظ بيانات قسم العقود');
  });
  main.querySelectorAll('[data-contract-done]').forEach(btn=>btn.onclick=async()=>{
    const c=customers.find(x=>x.id===btn.dataset.contractDone); if(!c) return;
    await dbf.collection('customers').doc(c.id).update({status:'done',managerAlert:false,lastUpdatedAt:Date.now(),workflowHistory:(c.workflowHistory||[]).concat([{at:Date.now(),from:'contracts',to:'done',action:'إكمال معاملة العقد'}])});
    beep(); showToast('تم إكمال معاملة العقد');
  });
}
function contractsCard(c){
  const sourceLabels={direct:'مباشر للشركة',manager:'عن طريق المدير',referral:'زبون جاب زبون',previous_customer:'زبون سابق',social_media:'سوشيال ميديا',partner_company:'شركة متعاونة',engineer:'مهندس',promoter:'مروج',engineer_promoter:'مهندس أو مروج'};
  return `<div class="card2" data-contract-card="${c.id}" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;">
    <div class="detail-row"><b>العميل</b>${escapeHtml(c.name)} — ${escapeHtml(c.phone)}</div>
    <div class="detail-row"><b>المشروع</b><span class="project-open-name" data-open-project="${c.id}">${escapeHtml(c.projectName||'—')}</span> — ${escapeHtml(c.branch||'—')}</div>
    <div class="detail-row"><b>طريقة الوصول</b>${sourceLabels[c.source]||escapeHtml(c.source)||'—'}</div>
    <div class="detail-row"><b>حالة العميل</b>${escapeHtml(c.clientStage||'—')}</div>
    <div class="detail-row"><b>ملاحظات الرسبشن</b>${escapeHtml(c.measurements)||'—'}</div>
    <div class="detail-row"><b>وقت الوصول للعقود</b>${baghdadDateTime(c.assignedAt)} — بتوقيت بغداد</div>
    <div class="detail-row"><b>المرفقات</b>${attachChips(c.attachments)||'—'}</div>
    <div class="detail-row"><b>الوقت</b>${timerHTML(c)}</div>
    <div class="grid2"><div class="field"><label>حالة العقد</label><select name="contractStatus"><option value="new" ${c.contractStatus==='new'?'selected':''}>جديد</option><option value="quote" ${c.contractStatus==='quote'?'selected':''}>عرض سعر</option><option value="negotiation" ${c.contractStatus==='negotiation'?'selected':''}>تفاوض</option><option value="signed" ${c.contractStatus==='signed'?'selected':''}>تم التعاقد</option></select></div><div class="field"><label>قيمة العقد</label><input name="contractValue" value="${escapeHtml(String(c.contractValue||''))}" placeholder="اكتب القيمة"></div></div>
    <div class="field"><label>ملاحظات قسم العقود</label><textarea name="contractNotes" placeholder="اكتب تفاصيل متابعة العقد...">${escapeHtml(c.contractNotes||'')}</textarea></div>
    <button class="btn small" data-save-contract="${c.id}">حفظ متابعة العقود</button>
    <button class="btn small secondary" data-contract-done="${c.id}" style="margin-top:10px;">إكمال معاملة العقد</button>
  </div>`;
}

// ---------- design ----------
function renderDesign(main, dept){
  const list = customers.filter(c=>c.status==='design_pending' && c.wantedDept===dept);
  main.innerHTML = `<h1>${dept==='3d'?'تصاميم 3D Max':'التصاميم'}</h1><div class="page-sub">المهام الواصلة لهذا القسم</div>
    ${dept==='3d' ? `<div class="section-note">قسم الـ 3D عمل مدفوع — ما تكدر تنهي المهمة إلا بعد استلام وصل من الحسابات.</div>`:''}
    <div class="card"><h2>قائمة المهام (${list.length})</h2>${list.length? list.map(c=>designCard(c,dept)).join('') : '<div class="empty">ماكو مهام حالياً</div>'}</div>`;
  wireCustomerTableLinks(main);
  main.querySelectorAll('[data-request-payment]').forEach(btn=>btn.onclick=()=>openPaymentForm(btn.dataset.requestPayment));
  main.querySelectorAll('[data-complete]').forEach(btn=>btn.onclick=async ()=>{ await dbf.collection('customers').doc(btn.dataset.complete).update({status:'done'}); });
}
function designCard(c, dept){
  const pay = payments.find(p=>p.customerId===c.id);
  const needsPayment = dept==='3d';
  const paid = pay && pay.status==='received';
  return `<div class="card2" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;">
    <div class="detail-row"><b>العميل</b><span class="project-open-name" data-open-project="${c.id}">${escapeHtml(c.name)}</span> — ${escapeHtml(c.phone)}</div>
    <div class="detail-row"><b>المشروع</b><span class="project-open-name" data-open-project="${c.id}">${escapeHtml(c.projectName||'—')}</span> — ${escapeHtml(c.branch||'—')}</div>
    <div class="detail-row"><b>القياسات</b>${escapeHtml(c.measurements)||'—'}</div>
    ${attachChips(c.attachments)}
    <div class="detail-row"><b>الوقت</b>${timerHTML(c)}</div>
    ${needsPayment ? (paid ? `<div class="detail-row"><b>حالة الدفع</b><span class="badge ok">تم استلام الفلوس ✓</span></div>`
      : `<div class="detail-row"><b>حالة الدفع</b>${pay? '<span class="badge warn">بانتظار تأكيد الحسابات</span>' : '<span class="badge wait">ما ارسلت طلب دفع بعد</span>'}</div>`) : ''}
    <div style="margin-top:10px;display:flex;gap:8px;">
      ${needsPayment && !pay ? `<button class="btn small secondary" data-request-payment="${c.id}">إرسال طلب دفع للحسابات</button>` : ''}
      <button class="btn small" data-complete="${c.id}" ${needsPayment && !paid?'disabled':''}>إنهاء المهمة</button>
    </div>
  </div>`;
}
function openPaymentForm(customerId){
  const c = customers.find(x=>x.id===customerId);
  const main = document.getElementById('mainView');
  const wrap = document.createElement('div');
  wrap.className='card';
  wrap.innerHTML = `<h2>طلب دفع — ${escapeHtml(c.name)}</h2>
    <form id="payForm">
      <div class="grid2">
        <div class="field"><label>المبلغ (دولار)</label><input type="number" name="usd" step="0.01" placeholder="0"></div>
        <div class="field"><label>المبلغ (دينار عراقي)</label><input type="number" name="iqd" step="1000" placeholder="0"></div>
      </div>
      <div class="field"><label>ملاحظات</label><textarea name="notes" placeholder="تفاصيل إضافية..."></textarea></div>
      <div style="display:flex;gap:8px;"><button class="btn" type="submit">إرسال للحسابات</button><button class="btn secondary" type="button" id="cancelPay">إلغاء</button></div>
    </form>`;
  main.prepend(wrap);
  wrap.querySelector('#cancelPay').onclick = ()=>wrap.remove();
  wrap.querySelector('#payForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    await dbf.collection('payments').add({
      customerId, customerName:c.name, amountUSD: parseFloat(f.get('usd'))||0, amountIQD: parseFloat(f.get('iqd'))||0,
      notes: f.get('notes')||'', status:'pending', receiptNote:'', receiptUrl:null, createdAt: Date.now(),
    });
    wrap.remove();
  };
}

// ---------- finance ----------
function renderFinance(main){
  const pending = payments.filter(p=>p.status==='pending');
  const done = payments.filter(p=>p.status==='received');
  main.innerHTML = `<h1>الحسابات</h1><div class="page-sub">طلبات استلام الفلوس من الأقسام</div>
    <div class="card"><h2>طلبات بانتظار الاستلام (${pending.length})</h2>${pending.length? pending.map(p=>financeCard(p)).join('') : '<div class="empty">ماكو طلبات حالياً</div>'}</div>
    <div class="card"><h2>الطلبات المستلمة (${done.length})</h2>
      ${done.length? `<table><thead><tr><th>الزبون</th><th>المبلغ</th><th>ملاحظات</th><th>الوصل</th></tr></thead><tbody>
        ${done.map(p=>`<tr><td>${escapeHtml(p.customerName)}</td><td>${p.amountUSD?p.amountUSD+' $':''} ${p.amountIQD?p.amountIQD+' د.ع':''}</td><td>${escapeHtml(p.receiptNote)}</td><td>${p.receiptUrl?`<a href="${p.receiptUrl}" target="_blank">عرض</a>`:'—'}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">لا يوجد سجل بعد</div>'}
    </div>`;
  payments.filter(p=>p.status==='pending').forEach(p=>{
    const card = main.querySelector(`[data-fcard="${p.id}"]`);
    let receiptFile = null;
    wireUploadRow(card.querySelector('.uz'), (files)=>{ receiptFile = files[0]; card.querySelector('.pending-chips').innerHTML = `<span class="attach-chip">📎 ${escapeHtml(receiptFile.name)}</span>`; });
    card.querySelector('[data-mark-paid]').onclick = async ()=>{
      const note = card.querySelector('textarea').value;
      await dbf.collection('payments').doc(p.id).update({status:'received', receiptNote: note, receiptUrl: receiptFile?receiptFile.url:null});
    };
  });
}
function financeCard(p){
  return `<div class="card2" data-fcard="${p.id}" style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;">
    <div class="detail-row"><b>الزبون</b>${escapeHtml(p.customerName)}</div>
    <div class="detail-row"><b>المبلغ</b>${p.amountUSD?p.amountUSD+' $  ':''}${p.amountIQD?p.amountIQD+' د.ع':''}</div>
    <div class="detail-row"><b>ملاحظات القسم</b>${escapeHtml(p.notes)||'—'}</div>
    <div class="field"><label>ملاحظات الحسابات (تفاصيل الاستلام)</label><textarea placeholder="كتابة تفاصيل المبلغ المستلم..."></textarea></div>
    <div class="uz">${uploadRowHTML()}</div>
    <div class="pending-chips attach-row"></div>
    <button class="btn small" data-mark-paid style="margin-top:10px;">تأكيد الاستلام وإرفاق الوصل</button>
  </div>`;
}

// ---------- chat ----------
function renderChat(main){
  main.innerHTML = `<h1>الشات الداخلي</h1><div class="page-sub">محادثة جماعية بين كل الموظفين — محفوظة بشكل دائم</div>
    <div class="card"><div class="chat-wrap">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input">
        <input type="text" id="chatText" placeholder="اكتب رسالة...">
        <button class="btn small" id="sendText">إرسال</button>
        <button type="button" class="btn small secondary" data-rec-btn>🎙️</button>
      </div>
    </div></div>`;
  const log = main.querySelector('#chatLog');
  log.innerHTML = messages.length ? messages.map(m=>`
    <div class="msg ${m.role===role?'me':''}">
      <div class="meta">${roleLabel(m.role)} · ${new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(m.createdAt))}</div>
      ${m.text?escapeHtml(m.text):''}
      ${m.audioUrl?`<audio controls src="${m.audioUrl}"></audio>`:''}
    </div>`).join('') : '<div class="empty">ابدأ المحادثة...</div>';
  log.scrollTop = log.scrollHeight;
  main.querySelector('#sendText').onclick = sendText;
  main.querySelector('#chatText').onkeydown = e=>{ if(e.key==='Enter') sendText(); };
  async function sendText(){
    const inp = main.querySelector('#chatText');
    const text = inp.value.trim();
    if(!text) return;
    await dbf.collection('chat_messages').add({role, text, createdAt: Date.now()});
    inp.value='';
  }
  wireUploadRow(main, async (files)=>{
    const a = files[0];
    await dbf.collection('chat_messages').add({role, audioUrl:a.url, createdAt: Date.now()});
  });
}

// ---------- team management (manager only) ----------
function renderTeam(main){
  main.innerHTML = `<h1>إدارة الموظفين</h1><div class="page-sub">سوي حساب لكل موظف بإيميل وباسورد من عندك، وحدد صلاحيته</div>
    <div class="card">
      <h2>+ إضافة موظف جديد</h2>
      <form id="addEmpForm">
        <div class="grid2">
          <div class="field"><label>البريد الإلكتروني</label><input type="email" name="email" required></div>
          <div class="field"><label>كلمة المرور</label><input type="password" name="password" required minlength="6"></div>
        </div>
        <div class="field"><label>الصلاحية</label>
          <select name="role" required>
            <option value="">— اختر —</option>
            ${ROLES.filter(r=>r.id!=='manager').map(r=>`<option value="${r.id}">${r.label}</option>`).join('')}
          </select>
        </div>
        <div class="login-err" id="addEmpErr"></div>
        <button class="btn" type="submit">إنشاء حساب الموظف</button>
      </form>
    </div>
    <div class="card"><h2>الموظفين (${teamUsers.length})</h2><div id="empList"></div></div>`;

  const addForm = main.querySelector('#addEmpForm');
  addForm.onsubmit = async (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const errBox = main.querySelector('#addEmpErr');
    errBox.textContent = '';
    try{
      const cred = await secondaryAuth.createUserWithEmailAndPassword(f.get('email'), f.get('password'));
      await dbf.collection('users').doc(cred.user.uid).set({
        email: f.get('email'), role: f.get('role'), createdAt: Date.now(),
      });
      await secondaryAuth.signOut();
      addForm.reset();
    }catch(err){ errBox.textContent = arErr(err.code); }
  };

  const list = main.querySelector('#empList');
  const others = teamUsers.filter(u=>u.id!==currentUser.uid);
  if(!others.length){ list.innerHTML = '<div class="empty">ماكو موظفين مضافين بعد — أضف أول موظف من الفورم فوق</div>'; return; }
  list.innerHTML = others.map(u=>`<div class="emp-row">
    <div><div style="font-weight:700;font-size:13.5px;">${escapeHtml(u.email)}</div><div class="hint">${u.role?roleLabel(u.role):'بانتظار تحديد الصلاحية'}</div></div>
    <select data-role-for="${u.id}">
      <option value="">— اختر —</option>
      ${ROLES.filter(r=>r.id!=='manager').map(r=>`<option value="${r.id}" ${u.role===r.id?'selected':''}>${r.label}</option>`).join('')}
    </select>
  </div>`).join('');
  list.querySelectorAll('[data-role-for]').forEach(sel=>{
    sel.onchange = async ()=>{ if(sel.value) await dbf.collection('users').doc(sel.dataset.roleFor).update({role: sel.value}); };
  });
}


function notifyAssigned(c){
  if(!c || !role || c.assignedRole!==role || c.status==='done' || notifiedAssigned.has(c.id)) return;
  notifiedAssigned.add(c.id);
  beep();
  showToast(`🔔 مشروع جديد وصل لقسمك: ${c.projectName||c.name}`);
  try{ if('Notification' in window && Notification.permission==='granted') new Notification('🔔 مشروع جديد لقسمك',{body:`${c.name} — ${c.projectName||''} — ${c.branch||''}`,requireInteraction:true}); }catch(e){}
}
// ---------- overdue watcher ----------
setInterval(()=>{
  if(!role) return;
  customers.forEach(c=>{
    if(c.deadlineAt && Date.now() > c.deadlineAt && c.status!=='done'){
      if(!notifiedOverdue.has(c.id)){
        notifiedOverdue.add(c.id);
        if(c.assignedRole===role){ beep(); showToast(`انتهى الوقت المحدد للزبون "${c.name}"`); notifyOverdue(c.name); }
        if(!c.managerAlert){ dbf.collection('customers').doc(c.id).update({managerAlert:true}).catch(()=>{}); }
      }
    }
  });
  updateTimers();
  renderNav();
}, 5000);

// ---------- boot / auth wiring ----------
function clearSubs(){ unsubs.forEach(u=>u()); unsubs=[]; }
async function checkManagerExists(){
  try{
    const snap = await dbf.collection('users').where('role','==','manager').limit(1).get();
    managerExists = !snap.empty;
  }catch(e){ managerExists = false; }
}
// Start on the login screen immediately so the UI can never get stuck on a loading overlay.
renderLogin('login');
let authResolved = false;
const authFallback = setTimeout(()=>{
  if(!authResolved && !currentUser){
    renderLogin('login');
    showToast('إذا عندك حساب، سجّلي الدخول.');
  }
}, 3500);
auth.onAuthStateChanged(async user=>{
  authResolved = true;
  clearTimeout(authFallback);
  clearSubs(); assignmentWatchReady=false; notifiedAssigned.clear();
  if(!user){
    currentUser=null; role=null; page='overview';
    await checkManagerExists();
    renderLogin('login');
    return;
  }
  currentUser = user;
  try {
    const initialUserDoc = await dbf.collection('users').doc(user.uid).get();
    const initialData = initialUserDoc.exists ? initialUserDoc.data() : null;
    role = initialData && initialData.role ? initialData.role : null;
    if(role && PAGES[role] && PAGES[role][0]) page = PAGES[role][0].id;
  } catch(e) { console.error('User role load error:', e); }
  renderApp();
  render();
  unsubs.push(dbf.collection('users').doc(user.uid).onSnapshot(snap=>{
    const data = snap.data();
    role = data ? data.role : null;
    if(role && !PAGES[role].find(p=>p.id===page)) page = PAGES[role][0].id;
    render();
  }));
  unsubs.push(dbf.collection('users').onSnapshot(snap=>{ teamUsers = snap.docs.map(d=>({id:d.id, ...d.data()})); if(page==='team') renderMain(); else renderNav(); }));
  unsubs.push(dbf.collection('customers').onSnapshot(snap=>{
    customers = snap.docs.map(d=>hydrateLegacyCustomer({id:d.id, ...d.data()}));
    if(assignmentWatchReady){ snap.docChanges().forEach(ch=>{ if(ch.type==='added'||ch.type==='modified') notifyAssigned({id:ch.doc.id,...ch.doc.data()}); }); }
    else { customers.filter(c=>c.assignedRole===role && c.status!=='done').forEach(c=>notifiedAssigned.add(c.id)); assignmentWatchReady=true; }
    render();
  }));
  unsubs.push(dbf.collection('payments').onSnapshot(snap=>{ payments = snap.docs.map(d=>({id:d.id, ...d.data()})); render(); }));
  unsubs.push(dbf.collection('chat_messages').orderBy('createdAt','asc').limit(200).onSnapshot(snap=>{ messages = snap.docs.map(d=>({id:d.id, ...d.data()})); if(page==='chat') renderMain(); }));
});

window.addEventListener('unhandledrejection', (e)=>{
  console.error('TNT unhandled rejection:', e.reason);
  if(!currentUser && document.getElementById('root')) renderLogin('login');
});
window.addEventListener('error', (e)=>{
  console.error('TNT runtime error:', e.error || e.message);
  if(!currentUser && document.getElementById('root')) renderLogin('login');
});
</script>
